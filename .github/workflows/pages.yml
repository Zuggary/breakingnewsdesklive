name: Update alerts and deploy Pages

on:
  schedule:
    - cron: '*/10 * * * *'  # GitHub runs this only about every 4 hours; the chain job below keeps the cadence
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: JS tests
        run: node tests/test-lib.js
      - name: Restore history (first-seen times and run log)
        uses: actions/cache@v4
        with:
          path: |
            data/seen.json
            data/closure-days.json
            data/log.jsonl
            data/gdelt-last.json
            data/context-cache.json
            data/news
            data/source-misses.json
          key: bnd-history-${{ github.run_id }}
          restore-keys: bnd-history-
      - name: Fetch the probe snapshot
        run: |
          mkdir -p data
          git fetch --depth 1 origin probe-data && git show FETCH_HEAD:probes.json > data/probes.json || rm -f data/probes.json
      - name: Fetch the auto items
        run: |
          mkdir -p data
          rm -f data/auto_items.json data/pulled.json
          rc=0; git ls-remote --exit-code --heads origin news-data >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            # Fail closed: any error here fails the build, so the previous deploy stays up and no pull list is ever read as empty.
            git fetch --depth 1 origin news-data
            git show FETCH_HEAD:auto_items.json > data/auto_items.json
            if git cat-file -e FETCH_HEAD:pulled.json 2>/dev/null; then git show FETCH_HEAD:pulled.json > data/pulled.json; fi
          elif [ "$rc" = 2 ]; then
            echo "No news-data branch yet."
          else
            echo "::error::cannot reach the news-data branch"; exit "$rc"
          fi
      - name: Build event data
        run: python tools/build_data.py --out data --news-pages
      - name: Report items held by the kill switch
        run: |
          python - <<'PY'
          import json, os
          if os.path.exists("data/held.json"):
              h = json.load(open("data/held.json"))
              if h["count"]:
                  print("::warning::%d items held by the kill switch: %s" % (h["count"], ", ".join(i["id"] for i in h["items"][:10])))
          PY
      - name: Check that every context item carries its credit
        run: python tools/context.py data/events.json
      - name: Prepare _site
        run: |
          rm -rf _site && mkdir -p _site/data
          for f in ads.txt 404.html index.html tv.html sun.js sun-overlay.js event.html data.html corrections.html about.html privacy.html count.js app.js lib.js sw.js style.css tokens.css favicon.svg CNAME robots.txt sitemap.xml; do cp "$f" _site/; done
          cp data/events.json data/sources.json data/world.json data/lead-story.json _site/data/
          mkdir -p _site/assets && cp -r assets/illustrations _site/assets/
          cp -r fonts _site/
          [ -d assets/stock ] && cp -r assets/stock _site/assets/ || true
          [ -f data/log.jsonl ] && cp data/log.jsonl _site/data/ || true
      - name: Copy generated news pages
        run: |
          [ ! -d data/news ] || cp -r data/news _site/
          rm -f _site/news/events.json
          for f in news-pages.xml news-sitemap.xml; do
            if [ -f "data/$f" ]; then
              cp "data/$f" _site/
              echo "Sitemap: https://breakingnewsdesklive.com/$f" >> _site/robots.txt
            fi
          done
      - name: Check that every public root file is published
        run: |
          missing=0
          for f in *.html *.js *.css *.txt *.xml *.svg CNAME; do
            [ -f "$f" ] || continue
            [ -f "_site/$f" ] || { echo "::error::$f is in the repo root but not in _site"; missing=1; }
          done
          for f in news-pages.xml news-sitemap.xml; do
            [ ! -f "data/$f" ] || [ -f "_site/$f" ] || { echo "::error::$f is missing from _site"; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - run: sleep 10
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # Cloudflare Pages deploy (FA44). Runs beside the GitHub Pages deploy; soft-fails so GitHub Pages stays live until cutover.
      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 07f52611c66e1817e67569f18d643e51
        run: npx -y wrangler@4 pages deploy _site --project-name breakingnewsdesklive --branch main --commit-dirty=true

  # GitHub's cron for this repo runs only about every 4 hours. This job re-dispatches the workflow about 8 minutes after each run,
  # unless another run is already queued or running (that run has its own chain). The cron entry above restarts the chain if it breaks.
  chain:
    needs: build-and-deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait
        run: sleep 420
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "${{ github.repository }}" --workflow pages.yml --json status -q '[.[]|select(.status=="queued" or .status=="in_progress")]|length')
          echo "active runs including this one: $n"
          if [ "$n" -le 1 ]; then gh workflow run pages.yml -R "${{ github.repository }}"; else echo "another run is active; not dispatching"; fi
