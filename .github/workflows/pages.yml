name: Update alerts and deploy Pages

on:
  schedule:
    - cron: '*/10 * * * *'  # GitHub runs this only about every 4 hours; the chain job below keeps the cadence
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: JS tests
        run: node tests/test-lib.js
      - name: Restore history (first-seen times and run log)
        uses: actions/cache@v4
        with:
          path: |
            data/seen.json
            data/log.jsonl
            data/gdelt-last.json
            data/context-cache.json
          key: bnd-history-${{ github.run_id }}
          restore-keys: bnd-history-
      - name: Build event data
        run: python tools/build_data.py --out data
      - name: Check that every context item carries its credit
        run: python tools/context.py data/events.json
      - name: Prepare _site
        run: |
          rm -rf _site && mkdir -p _site/data
          for f in ads.txt index.html tv.html event.html data.html corrections.html about.html privacy.html count.js app.js lib.js sw.js style.css tokens.css favicon.svg CNAME robots.txt sitemap.xml; do cp "$f" _site/; done
          cp data/events.json data/sources.json data/world.json _site/data/
          mkdir -p _site/assets && cp -r assets/illustrations _site/assets/
          cp -r fonts _site/
          [ -d assets/stock ] && cp -r assets/stock _site/assets/ || true
          [ -f data/log.jsonl ] && cp data/log.jsonl _site/data/ || true
      - name: Check that every public root file is published
        run: |
          missing=0
          for f in *.html *.js *.css *.txt *.xml *.svg CNAME; do
            [ -f "$f" ] || continue
            [ -f "_site/$f" ] || { echo "::error::$f is in the repo root but not in _site"; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - run: sleep 10
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # GitHub's cron for this repo runs only about every 4 hours. This job re-dispatches the workflow about 8 minutes after each run,
  # unless another run is already queued or running (that run has its own chain). The cron entry above restarts the chain if it breaks.
  chain:
    needs: build-and-deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait
        run: sleep 420
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "${{ github.repository }}" --workflow pages.yml --json status -q '[.[]|select(.status=="queued" or .status=="in_progress")]|length')
          echo "active runs including this one: $n"
          if [ "$n" -le 1 ]; then gh workflow run pages.yml -R "${{ github.repository }}"; else echo "another run is active; not dispatching"; fi
