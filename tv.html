<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breaking News Desk: TV</title>
<meta name="description" content="Full-screen live map and ticker of Breaking News Desk, made for a broadcast screen.">
<meta property="og:title" content="Breaking News Desk: TV">
<meta property="og:description" content="Full-screen live map and ticker of Breaking News Desk, made for a broadcast screen.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Breaking News Desk">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
:root{--bg:#070b10;--panel:#0f1620;--line:#1f2b3c;--text:#e8edf3;--mute:#93a1b5;--amber:#ffb020}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{display:grid;grid-template-columns:1fr 520px;grid-template-rows:72px 1fr 64px;height:100vh;width:100vw}
header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#0b1118}
.brand{font-weight:800;font-size:28px;letter-spacing:.03em}.brand i{color:var(--amber);font-style:normal}
.clocks{display:flex;gap:22px;font:600 16px ui-monospace,Menlo,monospace}.clocks span small{display:block;color:var(--mute);font-weight:400;font-size:11px;letter-spacing:.08em}
#mapcol{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
#mapcol{perspective:1600px;overflow:hidden}
body.tilt #map{transform:rotateX(38deg) scale(1.22) translateY(-4%);transform-origin:50% 60%;animation:sway 40s ease-in-out infinite alternate;will-change:transform}
@keyframes sway{from{transform:rotateX(38deg) rotateZ(-2deg) scale(1.22) translateY(-4%)}to{transform:rotateX(38deg) rotateZ(2deg) scale(1.22) translateY(-4%)}}
#lower{position:absolute;left:24px;right:24px;bottom:24px;background:rgba(10,16,24,.92);border:1px solid var(--line);border-left:6px solid var(--c,var(--amber));padding:14px 20px;transition:opacity .4s}
#lower b{font-size:30px;display:block}#lower span{color:var(--mute);font-size:17px}#lower em{display:block;margin-top:6px;font-style:normal;color:#f3dca5;font-size:15px}
#board{border-left:1px solid var(--line);padding:16px 18px;overflow:hidden;background:var(--panel)}
#board h2{margin:0 0 10px;font-size:20px;letter-spacing:.12em;color:var(--amber)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:9px 8px;border-bottom:1px solid var(--line);border-left:4px solid var(--c)}
.row.on{background:#18212e}.row .n{font:700 16px ui-monospace,Menlo,monospace;color:var(--mute);grid-row:span 2}
.row .t{font-weight:700}.row .p{color:var(--mute);font-size:14px}.row .w{font:13px ui-monospace,Menlo,monospace;color:var(--mute);text-align:right}
.row .s{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c);text-align:right}
footer{grid-column:1/3;display:flex;align-items:center;background:#2a2110;border-top:1px solid #4a3a14;overflow:hidden;white-space:nowrap}
footer .tag{background:var(--amber);color:#1a1200;font-weight:800;padding:0 18px;height:100%;display:flex;align-items:center;letter-spacing:.08em;z-index:1}
#crawl{display:inline-block;padding-left:100%;animation:c var(--d,120s) linear infinite;color:#f3dca5;font-size:20px}
@keyframes c{to{transform:translateX(-100%)}}
@media (max-width:900px){
 html,body{overflow:auto;height:auto}
 #stage{display:block;height:auto}
 header{flex-wrap:wrap;height:auto;padding:10px 14px;gap:6px}.brand{font-size:20px}.clocks{gap:12px;font-size:13px;flex-wrap:wrap}
 #mapcol{height:56vw;min-height:200px}#board{border-left:0}footer{height:48px}#lower{left:8px;right:8px;bottom:8px;padding:8px 10px}#lower b{font-size:18px}#lower em{display:none}
}
@media (prefers-reduced-motion:reduce){#crawl{animation:none;padding-left:12px;white-space:normal}footer{height:auto;padding:8px 0}}
</style></head><body>
<div id="stage">
<header><div class="brand"><i>&#9673;</i> BREAKING NEWS DESK <small style="font-size:13px;color:#93a1b5;font-weight:400;letter-spacing:0">facts as they come in, from public sources</small></div><div class="clocks" id="clocks"></div></header>
<div id="mapcol"><canvas id="map"></canvas><div id="lower"></div></div>
<aside id="board"><h2>TOP EVENTS</h2><div id="rows"></div></aside>
<footer><div class="tag">CHECK OFFICIAL SOURCES</div><div id="crawl"></div></footer>
</div>
<script src="lib.js"></script>
<script>
(function(){'use strict';
var B=BND,$=function(i){return document.getElementById(i)},cv=$('map'),ctx=cv.getContext('2d'),S={ev:[],world:[],i:0,gen:''};
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
var ZONES=[['UTC','UTC'],['PACIFIC','America/Los_Angeles'],['EASTERN','America/New_York'],['LONDON','Europe/London'],['TOKYO','Asia/Tokyo']];
function clocks(){var box=$('clocks');if(!box.children.length)ZONES.forEach(function(z){var s=el('span');s.appendChild(el('small',null,z[0]));s.appendChild(el('b',null,''));box.appendChild(s)});
 var d=new Date();ZONES.forEach(function(z,k){box.children[k].lastChild.textContent=d.toLocaleTimeString('en-GB',{timeZone:z[1],hour:'2-digit',minute:'2-digit'})})}
var V={lon:0,lat:0,z:1},VT={lon:0,lat:0,z:1},FLOOR=40,DWELL=20000;
function proj(lon,lat,W,H){var k=Math.min(W/360,H/180)*V.z;return{x:W/2+(lon-V.lon)*k,y:H/2-(lat-V.lat)*k,k:k}}
function aim(){var e=top()[S.i];if(e&&e.lat!=null&&e.score>=FLOOR&&CTL.zoom){VT={lon:e.lon,lat:e.lat,z:3}}else{VT={lon:0,lat:0,z:1}}}
function ease(){['lon','lat','z'].forEach(function(k){V[k]+=(VT[k]-V[k])*0.07})}
function floorList(){return S.ev.slice(0,8).filter(function(e){return e.score>=FLOOR})}
function top(){return S.ev.slice(0,8)}
function reason(e){var d=e.detail||{},r=[(e.score>=FLOOR?'Above the show threshold of '+FLOOR:'Below the show threshold of '+FLOOR+', no camera move'),'score '+e.score+' of 100','severity '+e.severity];if(e.type==='earthquake')r.push('magnitude '+d.magnitude);if(e.type==='weather')r.push(d.alerts+' active alert'+(d.alerts===1?'':'s'));r.push('reported '+B.ago(e.time));return r.join(' · ')}
function board(){var box=$('rows');box.textContent='';top().forEach(function(e,i){var r=el('div','row'+(i===S.i?' on':''));r.style.setProperty('--c',B.SEV[e.severity]);
 r.appendChild(el('span','n',String(i+1)));r.appendChild(el('span','t',e.title));r.appendChild(el('span','s',e.severity));r.appendChild(el('span','p',e.place));r.appendChild(el('span','w',B.ago(e.time)));box.appendChild(r)})}
function lower(){var e=top()[S.i];if(!e)return;var L=$('lower');L.textContent='';if(CTL.banner){L.style.setProperty('--c','#ffb020');L.appendChild(el('b',null,CTL.banner));L.appendChild(el('span',null,'Source data: '+e.source+'.'));return}L.style.setProperty('--c',B.SEV[e.severity]);
 L.appendChild(el('b',null,e.title+' — '+e.place));L.appendChild(el('span',null,e.summary+' Source: '+e.source+'.'));L.appendChild(el('em',null,'Why it is on screen: '+reason(e)))}
function crawl(){var items=S.ev.filter(function(e){return e.severity==='extreme'||e.severity==='severe'||e.score>=45}).slice(0,12).map(function(e){return e.title+', '+e.place+' ('+(e.source_short||e.source)+', '+B.ago(e.time)+')'});
 if(!items.length)items=['No severe events in the feeds right now'];items=CTL.extra.concat(items);var c=$('crawl');c.textContent=items.join('   ●   ')+'   ●   Automated from public sources. Check official sources.';c.style.setProperty('--d',Math.max(60,c.textContent.length*0.18)+'s')}
var WL=document.createElement('canvas'),WK='';
function worldLayer(W,H){var k=[W,H,V.lon.toFixed(3),V.lat.toFixed(3),V.z.toFixed(3)].join();if(k===WK)return WL;WK=k;WL.width=W;WL.height=H;var c=WL.getContext('2d'),d=W/(cv.getBoundingClientRect().width||W);
 c.fillStyle='#070b10';c.fillRect(0,0,W,H);c.fillStyle='#142033';c.strokeStyle='#243650';c.lineWidth=d;
 S.world.forEach(function(poly){var ring=poly[0],on=false,lx=null;c.beginPath();for(var i=0;i<ring.length;i++){var p=proj(ring[i][0],ring[i][1],W,H);if(lx!==null&&Math.abs(p.x-lx)>180*p.k)on=false;if(!on){c.moveTo(p.x,p.y);on=true}else c.lineTo(p.x,p.y);lx=p.x}c.fill();c.stroke()});
 return WL}
function draw(t){ease();var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,W=Math.round(r.width*d),H=Math.round(r.height*d);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 ctx.drawImage(worldLayer(W,H),0,0);
 var ph=(t||0)/1000;S.ev.slice(0,60).forEach(function(e,idx){if(e.lat==null)return;var p=proj(e.lon,e.lat,W,H),col=B.SEV[e.severity]||'#93a1b5',base=(3+e.score/16)*d,foc=idx===S.i&&idx<8;
  var pulse=(ph*0.6+idx*0.17)%1;ctx.beginPath();ctx.arc(p.x,p.y,base+pulse*base*4,0,7);ctx.strokeStyle=col;ctx.globalAlpha=(1-pulse)*(foc?.9:.35);ctx.lineWidth=(foc?3:1.5)*d;ctx.stroke();ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(p.x,p.y,foc?base*1.5:base,0,7);ctx.fillStyle=col;ctx.fill();if(foc){ctx.strokeStyle='#fff';ctx.lineWidth=2*d;ctx.stroke()}})}
/* Cap the page at 30 drawn frames a second. Unthrottled headless Chromium draws far more, which starves the encoder (stream fell to 7 fps). */
var LASTF=0;function frame(t){if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(frame);if(t-LASTF<30)return;LASTF=t;draw(t)}
function load(){Promise.all([fetch('data/events.json',{cache:'no-cache'}).then(function(r){return r.json()}),S.world.length?0:fetch('data/world.json').then(function(r){return r.json()})]).then(function(r){
  var SH={'usgs-quakes':'USGS','nws-alerts':'NWS',nhc:'NHC',eonet:'NASA',gdacs:'GDACS'};S.ev=r[0].events.filter(function(e){return e.type!=='statement'&&e.type!=='headline'});/* world-events headlines are kept off the stream until Zach decides (CoS, GD4) */S.ev.forEach(function(e){e.source_short=SH[e.source_id]||e.source});if(r[1])S.world=r[1];S.i=0;aim();board();lower();crawl();if(matchMedia('(prefers-reduced-motion: reduce)').matches)draw(0)}).catch(function(){})}
/* Control surface for the Showrunner kit (GD2). Every call is validated; nothing here reaches outside the page. */
var CTL={auto:new URLSearchParams(location.search).get('auto')!=='0',zoom:new URLSearchParams(location.search).get('zoom')!=='0',last:0,banner:'',extra:[]};
function blob(){return S.ev.map(function(e){return [e.title,e.place,e.score,e.summary,JSON.stringify(e.detail||{})].join(' ')}).join(' ').toLowerCase()}
function textOk(t){if(typeof t!=='string'||t.length>240)return false;var have={};(blob().match(/\d+(?:\.\d+)?/g)||[]).forEach(function(n){have[n]=1});return (t.match(/\d+(?:\.\d+)?/g)||[]).every(function(n){return have[n]})}
function cool(){var n=Date.now();if(n-CTL.last<20000)return false;CTL.last=n;return true}
window.BNDTV={
 version:1,
 state:function(){return{events:S.ev.slice(0,20).map(function(e){return{id:e.id,title:e.title,place:e.place,score:e.score,severity:e.severity,time:e.time}}),focus:(top()[S.i]||{}).id||null,auto:CTL.auto,generated:S.gen}},
 set_auto:function(on){CTL.auto=!!on;return true},
 set_tilt:function(on){document.body.classList.toggle('tilt',!!on);return true},
 focus_map:function(id){var i=top().findIndex(function(e){return e.id===id});if(i<0||!cool())return false;S.i=i;aim();board();lower();return true},
 show_card:function(id){return window.BNDTV.focus_map(id)},
 show_board_pass:function(){S.i=0;aim();board();lower();return true},
 push_ticker:function(t){if(!textOk(t))return false;CTL.extra.unshift(t);CTL.extra=CTL.extra.slice(0,5);crawl();return true},
 set_banner:function(t){if(t!==''&&!textOk(t))return false;CTL.banner=t;lower();return true},
 return_to_wide:function(){CTL.banner='';S.i=0;VT={lon:0,lat:0,z:1};board();lower();return true}
};
if(new URLSearchParams(location.search).get('tilt')==='1')document.body.classList.add('tilt');
clocks();setInterval(clocks,1000);load();setInterval(load,300000);requestAnimationFrame(frame);
setInterval(function(){if(!CTL.auto)return;var n=floorList().length;if(!n){S.i=0;aim();board();lower();return}S.i=(S.i+1)%n;aim();board();lower()},DWELL);
})();
</script><script src="/count.js" defer></script>
</body></html>
