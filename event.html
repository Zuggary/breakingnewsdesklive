<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event: Breaking News Desk</title><meta name="description" content="One event on Breaking News Desk with its source, time and the facts the source gives.">
<meta property="og:title" content="Event: Breaking News Desk">
<meta property="og:description" content="One event on Breaking News Desk with its source, time and the facts the source gives.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Breaking News Desk">
<meta name="twitter:card" content="summary">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0f14"></head><body>
<header class="top"><a class="brand" href="./"><span>Breaking News Desk<small>Facts as they come in, from public sources</small></span></a><nav><a href="./">Map</a><a href="/about">About</a><a href="/privacy">Privacy</a></nav></header>
<p class="aibug"><b>AI-ASSISTED WIRE DESK</b> Independent and automated. No agency is affiliated. Check official sources before you act.</p>
<main class="event-main"><section class="band ehero" id="ehero"><div class="wrap ehero-in"><p class="dateline"><a href="./">&larr; All events</a></p><h1 id="etitle">Loading</h1><p class="verdict" id="esum"></p><p class="srcline" id="esrc"></p></div></section>
<div class="page wide" id="ev"></div></main>
<script src="lib.js"></script>
<script>
(function(){var B=BND,box=document.getElementById('ev');
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
var id=new URLSearchParams(location.search).get('id');
function hero(e, generated){var h=document.getElementById('ehero');h.style.setProperty('--c',B.SEV[e.severity]||'#93a1b5');
 var f=B.itemFreshness(e,generated,Date.now());
 document.getElementById('etitle').textContent=B.cleanDc(e.title);
 var tl=el('span','pill',e.severity);tl.style.background=B.SEV[e.severity]||'#93a1b5';
 var sm=document.getElementById('esum');sm.textContent='';sm.appendChild(tl);sm.appendChild(document.createTextNode(' '+(B.TYPES[e.type]||B.TYPES.other).label+' \u00b7 '+B.cleanDc(e.place)));
 if(e.detail&&e.detail.reported_line){var rl=el('p','verdict');rl.textContent=B.cleanDc(e.detail.reported_line);sm.parentNode.insertBefore(rl,sm.nextSibling)}
 document.getElementById('esrc').textContent=B.cleanDc(e.summary)+' Source: '+B.cleanDc(e.source)+', '+f.ageText+'.';
 if(e.confidence){var cl=el('span','pill');cl.style.background='#fff';cl.style.marginLeft='8px';cl.textContent=e.confidence;sm.appendChild(document.createTextNode(' '));sm.appendChild(cl)}
 if(e.status){var sl=el('span','pill');sl.style.background='#fff';sl.style.marginLeft='8px';sl.textContent=e.status;sm.appendChild(document.createTextNode(' '));sm.appendChild(sl)}
 var tag=B.stockTag(e);if(!tag||!matchMedia('(min-width:980px)').matches)return;
 fetch('assets/stock/manifest.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(m){var it=B.pickStock(m,tag,e.id);if(!it)return;
  var a=el('div','eart');a.appendChild(B.stockPicture(it,'45vw',true));a.appendChild(el('span','illus-tag','Illustration'));h.appendChild(a)}).catch(function(){})}
fetch('data/events.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('Event data');return r.json()}).then(function(d){
 box.textContent='';var raw=d.events.filter(function(x){return x.id===id})[0];
 if(!raw){document.getElementById('etitle').textContent='This event is no longer in the feeds';box.appendChild(el('p',null,'Events leave the list after 3 days (7 days for fires, floods and volcanoes), or when the source removes them. Check the source agency for the record.'));return}
 var e=B.sanitizeEvent(raw),f=B.itemFreshness(e,d.generated,Date.now());
 document.title=B.cleanDc(e.title)+': Breaking News Desk';
  hero(e,d.generated);
 var tb=el('table'),rows=[['Event time (UTC)',e.time.replace('T',' ').replace('Z','')],['Age',f.ageText],['Source',B.cleanDc(e.source)],['Region',B.cleanDc(e.region)]];
 if(e.lat!=null)rows.push(['Position',e.lat+', '+e.lon]);
 Object.keys(e.detail||{}).forEach(function(k){var v=e.detail[k];if(v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)))return;rows.push([k.replace(/_/g,' '),Array.isArray(v)?v.map(function(x){return B.cleanDc(String(x))}).join(', '):B.cleanDc(String(v))])});
 rows.push(['Data built (UTC)',d.generated.replace('T',' ').replace('Z','')]);
 rows.forEach(function(r){var tr=el('tr');var th=el('th',null,r[0]);th.scope='row';tr.appendChild(th);tr.appendChild(el('td',null,r[1]));tb.appendChild(tr)});box.appendChild(tb);
 var cb=B.renderContext(e.context||{},e,'h2');if(e.context||cb.querySelector('figure'))box.appendChild(cb);
 if(e.links&&e.links.length){box.appendChild(el('h2',null,'Also reported by'));var ul=el('ul');e.links.forEach(function(x){var li=el('li');li.appendChild(B.sourceLink(x.url,B.cleanDc(x.label)+': '+B.cleanDc(x.title),'noopener nofollow'));ul.appendChild(li)});box.appendChild(ul)}
 var u=B.safeUrl(e.source_url);if(u){var p=el('p'),a=el('a',null,'Open the official page');a.href=u;a.rel='noopener';p.appendChild(a);box.appendChild(p)}
 box.appendChild(el('p','warn',(e.type==='headline'||e.type==='statement')?'Headlines and statements are claims by the named outlet or party. This site does not verify them. It is automated and may be wrong. Check official sources.':'Check official sources. This site is automated and may be wrong or late.'));
 var cp=el('p'),ca=el('a',null,'Report an error or ask for a correction');ca.href='/corrections';cp.appendChild(ca);box.appendChild(cp);
}).catch(function(){document.getElementById('etitle').textContent='Data could not be loaded. Try again in a minute.';box.textContent='Data could not be loaded. Try again in a minute.'});})();
</script><script src="/count.js" defer></script>
</body></html>
